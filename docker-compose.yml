services:
  dashboard:
    build: .
    container_name: brewster-dashboard
    restart: unless-stopped
    ports:
      - "49199:49199"
    env_file:
      - .env
    volumes:
      - db-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=49199
      - DB_PATH=/app/data/dashboard.db

volumes:
  db-data:
